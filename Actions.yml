openapi: 3.1.0
info:
  title: Habitica Proxy API
  version: 1.0.0
  description: ChatGPT Action schema for the Habitica proxy.
servers:
  - url: https://your-proxy-domain.example.com
security:
  - bearerAuth: []
paths:
  /habitica/tasks/user:
    get:
      operationId: getUserTasks
      summary: Get user tasks
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [habits, dailies, todos, rewards, completedTodos]
      responses:
        '200':
          description: Habitica response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createUserTask
      summary: Create user task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Habitica response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /habitica/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTask
      summary: Get task by id
      responses:
        '200':
          description: Habitica response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateTask
      summary: Update task by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Habitica response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTask
      summary: Delete task by id
      responses:
        '200':
          description: Habitica response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
